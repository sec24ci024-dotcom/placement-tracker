<!DOCTYPE html>
<html>
<head>
    <title>Placement Preparation Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">

        <div>
            <h1>Placement Preparation Tracker</h1>

            <p>
                Track your progress and become placement ready.
            </p>
        </div>

    </header>

    <main>

        <section class="overall-progress">

            <h2>Overall Progress</h2>

            <p id="overall-completion">
                Completed: 0 / 0
            </p>

            <div class="overall-progress-container">
                <div id="overall-progress-bar"></div>
            </div>

            <p id="overall-progress-text">0%</p>

        </section>

        <section class="statistics">

            <div class="stat-card">

                <span class="stat-label">
                    Total Tasks
                </span>

                <p id="total-tasks">0</p>

            </div>

            <div class="stat-card">

                <span class="stat-label">
                    Completed
                </span>

                <p id="completed-tasks">0</p>

            </div>

            <div class="stat-card">

                <span class="stat-label">
                    Pending
                </span>

                <p id="pending-tasks">0</p>

            </div>

        </section>

        <section>

            <h2 class="section-title">
                Preparation Categories
            </h2>

            <div id="dashboard"></div>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
